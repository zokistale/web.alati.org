<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="favicon.ico">
	<title>String Generator</title>
	<script src="assets/app.dd75c6c8.js" defer></script>
	<link rel="stylesheet" href="assets/style.0eb91aa6.css">
</head>
<body>

<div class="md:flex gap-10">
	<div data-app-navigation></div>
	<div>
		<div class="w-full max-w-lg bg-white dark:bg-gray-900 p-8 md:p-10 rounded-xl shadow-2xl transition-all duration-300">
			<h1 data-app-page-title class="text-3xl font-bold mb-6 border-b dark:border-gray-700 pb-2"></h1>
			<p class="mb-6">Generate cryptographically secure placeholder strings.</p>

			<!-- Input Section -->
			<div class="space-y-4">
				<div>
					<label for="stringLength" class="block text-sm font-medium">String Length (Max 100)</label>
					<input type="number" id="stringLength" value="25" min="1" max="100" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 transition duration-150" placeholder="e.g., 25">
				</div>

				<div>
					<h2 class="text-sm font-bold uppercase tracking-wider mb-4">Characters to include</h2>
					<div class="grid grid-cols-1 sm:grid-cols-2 gap-y-4 gap-x-6">
						<label class="flex items-center gap-3 cursor-pointer group">
							<input type="checkbox" id="check-lowercase" checked class="w-5 h-5 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 accent-indigo-600">
							<span class="text-sm font-medium">Lowercase (a..z)</span>
						</label>
						<label class="flex items-center gap-3 cursor-pointer group">
							<input type="checkbox" id="check-uppercase" checked class="w-5 h-5 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 accent-indigo-600">
							<span class="text-sm font-medium">Uppercase (A..Z)</span>
						</label>
						<label class="flex items-center gap-3 cursor-pointer group">
							<input type="checkbox" id="check-digits" checked class="w-5 h-5 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 accent-indigo-600">
							<span class="text-sm font-medium">Digits (0..9)</span>
						</label>
						<label class="flex items-center gap-3 cursor-pointer group">
							<input type="checkbox" id="check-special" checked class="w-5 h-5 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 accent-indigo-600">
							<span class="text-sm font-medium">Special Characters</span>
						</label>
					</div>
				</div>

				<button id="generateBtn" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-lg text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 transform hover:scale-[1.01] active:scale-[0.98]">
					Generate Strings
				</button>
			</div>

			<!-- Output Section -->
			<div id="results-container" class="mt-8">
				<div class="flex items-center justify-between mb-4 px-2">
					<h3 class="text-xs font-black uppercase tracking-widest">Generated strings</h3>
					<button id="copy-all-btn" class="flex items-center space-x-1 text-sm text-indigo-600 hover:text-indigo-800 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer transition duration-150" title="Copy all" disabled>
						<x-icon-copy class="h-4 w-4" />
						<span id="copy-all-text">Copy All</span>
					</button>
				</div>
				<div id="results-list" class="space-y-3">
					<!-- Result items will be injected here -->
				</div>
			</div>

			<!-- Message Box for Custom Alerts -->
			<div id="messageBox" class="fixed inset-0 bg-gray-900 bg-opacity-75 hidden items-center justify-center p-4 z-50">
				<div class="bg-white dark:bg-gray-950 p-6 rounded-lg shadow-xl max-w-sm w-full">
					<h3 id="messageTitle" class="text-lg font-bold mb-3"></h3>
					<p id="messageContent" class="mb-4"></p>
					<button onclick="closeMessageBox()" class="w-full py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">
						OK
					</button>
				</div>
			</div>
		</div>
	</div>
</div>

<script>
	const CHAR_SETS = {
		lowercase: 'abcdefghijklmnopqrstuvwxyz',
		uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
		digits: '0123456789',
		special: '!@#$%^*()_+-=[]{}|;:,.?'
	};

	// DOM elements
	const stringLength = document.getElementById('stringLength');
	const generateBtn = document.getElementById('generateBtn');
	const resultsContainer = document.getElementById('results-container');
	const resultsList = document.getElementById('results-list');
	const copyAllBtn = document.getElementById('copy-all-btn');
	const copyAllText = document.getElementById('copy-all-text');
	const messageBox = document.getElementById('messageBox');
	const messageTitle = document.getElementById('messageTitle');
	const messageContent = document.getElementById('messageContent');

	// Checkboxes
	const checks = {
		lowercase: document.getElementById('check-lowercase'),
		uppercase: document.getElementById('check-uppercase'),
		digits: document.getElementById('check-digits'),
		special: document.getElementById('check-special')
	};

	let generatedStrings = [];

	function showMessageBox(title, content) {
		messageTitle.textContent = title;
		messageContent.textContent = content;
		messageBox.classList.remove('hidden');
		messageBox.classList.add('flex');
	}

	function closeMessageBox() {
		messageBox.classList.add('hidden');
		messageBox.classList.remove('flex');
	}

	// Generation logic
	function generateStrings() {
		const length = parseInt(stringLength.value);
		let characters = '';

		if (Number.isNaN(length) || length <= 0) {
			stringLength.value = 1; // Reset to minimum allowed
			showMessageBox('Invalid Input', 'Please enter a valid number greater than 0.');
			return;
		}

		if (length > 100) {
			stringLength.value = 100; // Reset to max allowed
			showMessageBox('Length Limit', 'The maximum allowed length is 100.');
			return;
		}

		if (checks.lowercase.checked) characters += CHAR_SETS.lowercase;
		if (checks.uppercase.checked) characters += CHAR_SETS.uppercase;
		if (checks.digits.checked) characters += CHAR_SETS.digits;
		if (checks.special.checked) characters += CHAR_SETS.special;

		if (!characters) {
			generatedStrings = [];
			renderResults();
			showMessageBox('Character Set Required', 'Please select at least one character set.');
			return;
		}

		generatedStrings = [];
		for (let i = 0; i < 10; i++) {
			let str = '';
			const randomValues = new Uint32Array(length);
			window.crypto.getRandomValues(randomValues);
			for (let j = 0; j < length; j++) {
				str += characters.charAt(randomValues[j] % characters.length);
			}
			generatedStrings.push(str);
		}

		renderResults();
	}

	function renderResults() {
		resultsContainer.classList.remove('hidden');
		resultsList.innerHTML = '';
		copyAllBtn.disabled = generatedStrings.length === 0;
		copyAllText.textContent = 'Copy All';

		generatedStrings.forEach((str, idx) => {
			const div = document.createElement('div');
			div.className = 'animate-in bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 p-3 rounded-lg flex items-center justify-between gap-4 group hover:border-indigo-300 transition-all shadow-sm';
			div.style.animationDelay = `${idx * 0.05}s`;

			div.innerHTML = `
				<code class="font-mono text-sm sm:text-base break-all select-all">${str}</code>
				<button class="copy-single-btn shrink-0 p-2 text-gray-400 hover:text-indigo-700 hover:bg-gray-200 dark:hover:text-indigo-300 dark:hover:bg-gray-600 rounded-lg transition-all" title="Copy string">
					<x-icon-copy class="w-5 h-5 icon-copy" />
					<x-icon-check class="w-5 h-5 text-emerald-600 hidden icon-check" />
				</button>
			`;

			const btn = div.querySelector('.copy-single-btn');
			btn.addEventListener('click', () => copyToClipboard(str, btn));
			resultsList.appendChild(div);
		});
	}

	async function copyToClipboard(text, button) {
		try {
			await navigator.clipboard.writeText(text);
			const copyIcon = button.querySelector('.icon-copy');
			const checkIcon = button.querySelector('.icon-check');

			copyIcon.classList.add('hidden');
			checkIcon.classList.remove('hidden');
			setTimeout(() => {
				copyIcon.classList.remove('hidden');
				checkIcon.classList.add('hidden');
			}, 2000);
		} catch (err) {
			console.error('Failed to copy!', err);
		}
	}

	function copyAllStrings() {
		const allText = generatedStrings.join('\n');

		if (!allText.trim()) {
			showMessageBox('Nothing to Copy', 'Please generate some strings first.');
			return;
		}

		const tempTextarea = document.createElement('textarea');
		tempTextarea.value = allText;
		document.body.appendChild(tempTextarea);
		tempTextarea.select();

		try {
			document.execCommand('copy');
			copyAllText.textContent = 'Copied!';
			setTimeout(() => {
				copyAllText.textContent = 'Copy All';
			}, 2000);
		} catch (err) {
			showMessageBox('Copy Failed', 'Unable to copy text. Please select and copy manually.');
			console.error('Failed to copy all!', err);
		} finally {
			document.body.removeChild(tempTextarea);
		}
	}

	copyAllBtn.addEventListener('click', copyAllStrings);

	generateBtn.addEventListener('click', generateStrings);

	// Initial generation
	generateStrings();
</script>

</body>
</html>
