<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="favicon.ico">
	<title>MKD Exchange Rates</title>
	<script src="js/app.js" defer></script>
	<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="md:flex gap-10">
	<div data-app-navigation></div>
	<div class="w-full max-w-lg bg-white dark:bg-gray-900 p-8 md:p-10 rounded-xl shadow-2xl transition-all duration-300">
		<h1 data-app-page-title class="text-3xl font-bold mb-3 border-b dark:border-gray-700 pb-2"></h1>
		<p class="mb-6 text-slate-600 dark:text-slate-300">Fetch the currency exchange rates in real-time from the National Bank of Macedonia.</p>

		<div class="mb-6 flex flex-col sm:flex-row sm:items-center gap-3">
			<button id="fetchRatesBtn" class="inline-flex flex-shrink-0 justify-center py-2 px-6 border border-transparent rounded-lg shadow-lg text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 transform hover:scale-[1.01] active:scale-[0.98]">
				Get Rates
			</button>
			<p id="statusMessage" class="text-sm text-slate-500 dark:text-slate-400"></p>
		</div>

		<div class="overflow-x-auto">
			<table id="ratesTable" class="w-full border border-gray-200 dark:border-gray-700 rounded-xl overflow-hidden text-right text-sm text-slate-800 dark:text-slate-200">
				<thead class="bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-slate-100">
					<tr>
						<th class="text-left px-4 py-3">Code</th>
						<th class="px-4 py-3">Buy</th>
						<th class="px-4 py-3">Sell</th>
					</tr>
				</thead>
				<tbody id="ratesBody" class="bg-white dark:bg-slate-950">
					<tr class="border-t border-gray-200 dark:border-gray-800">
						<td class="text-left px-4 py-3">EUR</td>
						<td class="px-4 py-3">61.38</td>
						<td class="px-4 py-3">61.99</td>
					</tr>
					<tr class="border-t border-gray-200 dark:border-gray-800">
						<td class="text-left px-4 py-3">USD</td>
						<td class="px-4 py-3">52.85</td>
						<td class="px-4 py-3">53.38</td>
					</tr>
					<tr class="border-t border-gray-200 dark:border-gray-800">
						<td class="text-left px-4 py-3">GBP</td>
						<td class="px-4 py-3">71.06</td>
						<td class="px-4 py-3">71.78</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</div>

<script>
const CACHE_KEY = 'mkd-exchange-rates-cache';
const CACHE_TTL = 2 * 60 * 60 * 1000; // 2 hours
const fetchRatesBtn = document.getElementById('fetchRatesBtn');
const ratesBody = document.getElementById('ratesBody');
const statusMessage = document.getElementById('statusMessage');

const SAMPLE_RATES = [
	{ code: 'EUR', buy: 61.38, sell: 61.99 },
	{ code: 'USD', buy: 52.85, sell: 53.38 },
	{ code: 'GBP', buy: 71.06, sell: 71.78 }
];

function setStatus(message, isError = false) {
	statusMessage.textContent = message;
	statusMessage.classList.toggle('text-rose-600', isError);
	statusMessage.classList.toggle('text-slate-500', !isError);
}

function formatRateValue(value) {
	return Number(value).toFixed(2);
}

function renderRates(rates) {
	const visibleRates = Array.isArray(rates)
		? rates.filter((rate) => rate && (Number(rate.buy) !== 0 || Number(rate.sell) !== 0))
		: [];

	if (visibleRates.length === 0) {
		ratesBody.innerHTML = '<tr><td class="text-left px-4 py-4" colspan="3">No exchange rates available.</td></tr>';
		return;
	}

	ratesBody.innerHTML = visibleRates.map((rate) => {
		return `
			<tr class="border-t border-gray-200 dark:border-gray-800">
				<td class="text-left px-4 py-3">${String(rate.code)}</td>
				<td class="px-4 py-3">${formatRateValue(rate.buy)}</td>
				<td class="px-4 py-3">${formatRateValue(rate.sell)}</td>
			</tr>
		`;
	}).join('');
}

function loadCachedRates() {
	try {
		const raw = localStorage.getItem(CACHE_KEY);
		if (!raw) {
			return null;
		}

		const cache = JSON.parse(raw);
		if (!cache || typeof cache !== 'object' || !Array.isArray(cache.rates) || typeof cache.timestamp !== 'number') {
			return null;
		}

		if (Date.now() - cache.timestamp > CACHE_TTL) {
			return null;
		}

		return cache.rates;
	} catch (error) {
		return null;
	}
}

function saveRatesToCache(rates) {
	try {
		localStorage.setItem(CACHE_KEY, JSON.stringify({ timestamp: Date.now(), rates }));
	} catch (error) {
		// ignore storage failures
	}
}

function detectUtf16Encoding(arrayBuffer) {
	const bytes = new Uint8Array(arrayBuffer);
	if (bytes.length >= 2) {
		if (bytes[0] === 0xFF && bytes[1] === 0xFE) {
			return 'utf-16le';
		}
		if (bytes[0] === 0xFE && bytes[1] === 0xFF) {
			return 'utf-16be';
		}
	}

	let evenNulls = 0;
	let oddNulls = 0;
	const len = Math.min(bytes.length, 80);

	for (let index = 0; index + 1 < len; index += 2) {
		if (bytes[index] === 0x00) {
			evenNulls += 1;
		}
		if (bytes[index + 1] === 0x00) {
			oddNulls += 1;
		}
	}

	if (evenNulls > oddNulls && evenNulls >= 3) {
		return 'utf-16be';
	}

	if (oddNulls > evenNulls && oddNulls >= 3) {
		return 'utf-16le';
	}

	return null;
}

function decodeResponse(arrayBuffer) {
	const utf16Encoding = detectUtf16Encoding(arrayBuffer);

	let text = null;

	if (utf16Encoding) {
		text = new TextDecoder(utf16Encoding).decode(arrayBuffer);
	} else {
		text = new TextDecoder('utf-8').decode(arrayBuffer);
	}

	if (text && /<\?xml[^>]+encoding=["']utf-16["']/i.test(text)) {
		text = text.replace(/(<\?xml[^>]+encoding=["'])utf-16(["'][^>]*\?>)/i, '$1UTF-8$2');
	}

	return text.trim();
}

function parseExchangeRatesXml(xmlText) {
	const parser = new DOMParser();
	const xmlDocument = parser.parseFromString(xmlText, 'application/xml');
	if (xmlDocument.querySelector('parsererror')) {
		throw new Error('Unable to parse XML response from NBRM.');
	}

	const items = Array.from(xmlDocument.querySelectorAll('GetExchangeRates'));
	if (items.length === 0) {
		return [];
	}

	return items.map((item) => {
		const code = item.querySelector('Oznaka')?.textContent?.trim() || '';
		const buy = parseFloat(item.querySelector('Kupoven')?.textContent?.trim() || '0') || 0;
		const sell = parseFloat(item.querySelector('Prodazen')?.textContent?.trim() || '0') || 0;
		return { code, buy, sell };
	}).filter((rate) => rate.code && (rate.buy !== 0 || rate.sell !== 0));
}

async function fetchRatesFromNbm() {
	const today = new Date();
	const dateString = `${String(today.getDate()).padStart(2, '0')}.${String(today.getMonth() + 1).padStart(2, '0')}.${today.getFullYear()}`;
	const url = `https://www.nbrm.mk/KLServiceNOV/EN/GetExchangeRates?StartDate=${dateString}&EndDate=${dateString}`;

	const response = await fetch(url, {
		headers: { Accept: 'application/xml' },
	});

	if (!response.ok) {
		throw new Error(`Request failed with status ${response.status}`);
	}

	const arrayBuffer = await response.arrayBuffer();
	const xmlText = decodeResponse(arrayBuffer);

	if (!xmlText || xmlText.indexOf('<') === -1) {
		throw new Error('Received invalid XML from NBM.');
	}

	return parseExchangeRatesXml(xmlText);
}

async function updateRates() {
	setStatus('Checking cached rates...');
	const cachedRates = loadCachedRates();
	if (cachedRates) {
		renderRates(cachedRates);
		setStatus('Loaded cached rates from localStorage.');
		return;
	}

	fetchRatesBtn.disabled = true;
	setStatus('Fetching latest rates from NBM...');

	try {
		const rates = await fetchRatesFromNbm();
		if (!rates.length) {
			throw new Error('The response did not contain exchange rates.');
		}

		renderRates(rates);
		saveRatesToCache(rates);
		setStatus('Live rates loaded and cached for 2 hours.');
	} catch (error) {
		setStatus(error.message || 'Unable to fetch exchange rates. If you are hosting this as static files, the NBM endpoint may be blocked by CORS.', true);
	} finally {
		fetchRatesBtn.disabled = false;
	}
}

fetchRatesBtn.addEventListener('click', updateRates);

if (loadCachedRates()) {
	setStatus('Cached rates are available. Click to refresh.');
} else {
	setStatus('Click to fetch live exchange rates from NBM.');
}
</script>

</body>
</html>
