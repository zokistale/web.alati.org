<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="favicon.ico">
	<title>Text Transformer</title>
	<script src="assets/app.c2f8d860.js" defer></script>
	<link rel="stylesheet" href="assets/style.c79a68cf.css">
</head>
<body>

<div class="md:flex gap-10">
	<div data-app-navigation></div>
	<div>
		<div class="w-full max-w-lg bg-white dark:bg-gray-900 p-8 md:p-10 rounded-xl shadow-2xl transition-all duration-300">
			<h1 data-app-page-title class="text-3xl font-bold mb-6 border-b dark:border-gray-700 pb-2"></h1>
			<p class="mb-6">Convert any text into professional titles or URL-friendly slugs for files and web pages.</p>

			<!-- Input Section -->
			<div class="space-y-4">
				<div>
					<label for="textInput" class="block text-sm font-medium">Enter your text</label>
					<textarea id="textInput" rows="3" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 transition duration-150" placeholder="Type or paste your text here...">This is a sample text.</textarea>
				</div>

				<button id="transformBtn" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-lg text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 transform hover:scale-[1.01] active:scale-[0.98]">
					Transform Text
				</button>
			</div>

			<!-- Output Section -->
			<div class="mt-8 space-y-6">
				<!-- Title Case Card -->
				<div>
					<div class="flex justify-between items-center mb-2">
						<h2 class="text-sm font-bold uppercase tracking-wider">Title Case</h2>
						<button type="button" class="copy-btn flex items-center space-x-1 text-xs text-indigo-600 hover:text-indigo-800 cursor-pointer transition duration-150" data-copy-target="titleOutput" data-copy-label="titleCopyText" title="Copy to clipboard">
							<x-icon-copy class="h-4 w-4" />
							<span id="titleCopyText">Copy</span>
						</button>
					</div>
					<div id="titleOutput" class="border border-gray-200 rounded-lg p-3 text-sm font-medium">This Is A Sample Text.</div>
				</div>

				<!-- Lowercase Card -->
				<div>
					<div class="flex justify-between items-center mb-2">
						<h2 class="text-sm font-bold uppercase tracking-wider">Lowercase</h2>
						<button type="button" class="copy-btn flex items-center space-x-1 text-xs text-indigo-600 hover:text-indigo-800 cursor-pointer transition duration-150" data-copy-target="lowercaseOutput" data-copy-label="lowercaseCopyText" title="Copy to clipboard">
							<x-icon-copy class="h-4 w-4" />
							<span id="lowercaseCopyText">Copy</span>
						</button>
					</div>
					<div id="lowercaseOutput" class="border border-gray-200 rounded-lg p-3 text-sm font-medium">this is a sample text.</div>
				</div>

				<!-- Uppercase Card -->
				<div>
					<div class="flex justify-between items-center mb-2">
						<h2 class="text-sm font-bold uppercase tracking-wider">Uppercase</h2>
						<button type="button" class="copy-btn flex items-center space-x-1 text-xs text-indigo-600 hover:text-indigo-800 transition duration-150" data-copy-target="uppercaseOutput" data-copy-label="uppercaseCopyText">
							<x-icon-copy class="h-4 w-4" />
							<span id="uppercaseCopyText">Copy</span>
						</button>
					</div>
					<div id="uppercaseOutput" class="border border-gray-200 rounded-lg p-3 text-sm font-medium">THIS IS A SAMPLE TEXT.</div>
				</div>

				<!-- Camel Case Card -->
				<div>
					<div class="flex justify-between items-center mb-2">
						<h2 class="text-sm font-bold uppercase tracking-wider">Camel Case</h2>
						<button type="button" class="copy-btn flex items-center space-x-1 text-xs text-indigo-600 hover:text-indigo-800 transition duration-150" data-copy-target="camelOutput" data-copy-label="camelCopyText">
							<x-icon-copy class="h-4 w-4" />
							<span id="camelCopyText">Copy</span>
						</button>
					</div>
					<div id="camelOutput" class="border border-gray-200 rounded-lg p-3 text-sm text-indigo-700 dark:text-indigo-400 font-mono break-all">thisIsASampleText</div>
				</div>

				<!-- Snake Case Card -->
				<div>
					<div class="flex justify-between items-center mb-2">
						<h2 class="text-sm font-bold uppercase tracking-wider">Snake Case</h2>
						<button type="button" class="copy-btn flex items-center space-x-1 text-xs text-indigo-600 hover:text-indigo-800 transition duration-150" data-copy-target="snakeOutput" data-copy-label="snakeCopyText">
							<x-icon-copy class="h-4 w-4" />
							<span id="snakeCopyText">Copy</span>
						</button>
					</div>
					<div id="snakeOutput" class="border border-gray-200 rounded-lg p-3 text-sm text-indigo-700 dark:text-indigo-400 font-mono break-all">this_is_a_sample_text</div>
				</div>

				<!-- Slug Card -->
				<div>
					<div class="flex justify-between items-center mb-2">
						<h2 class="text-sm font-bold uppercase tracking-wider">URL Slug</h2>
						<button type="button" class="copy-btn flex items-center space-x-1 text-xs text-indigo-600 hover:text-indigo-800 transition duration-150" data-copy-target="slugOutput" data-copy-label="slugCopyText">
							<x-icon-copy class="h-4 w-4" />
							<span id="slugCopyText">Copy</span>
						</button>
					</div>
					<div id="slugOutput" class="border border-gray-200 rounded-lg p-3 text-sm text-indigo-700 dark:text-indigo-400 font-mono break-all">this-is-a-sample-text</div>
				</div>
			</div>

			<!-- Message Box -->
			<div id="messageBox" class="fixed inset-0 bg-gray-900 bg-opacity-90 hidden items-center justify-center p-4 z-50">
				<div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-xl max-w-sm w-full">
					<h3 id="messageTitle" class="text-lg font-bold mb-3"></h3>
					<p id="messageContent" class="mb-4"></p>
					<button onclick="closeMessageBox()" class="w-full py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">
						OK
					</button>
				</div>
			</div>
		</div>
	</div>
</div>

<script type="module">
	const { copyTextToClipboard, flashCopyFeedback } = window;

	const messageBox = document.getElementById('messageBox');
	const messageTitle = document.getElementById('messageTitle');
	const messageContent = document.getElementById('messageContent');
	const textInput = document.getElementById('textInput');
	const transformBtn = document.getElementById('transformBtn');
	const lowercaseOutput = document.getElementById('lowercaseOutput');
	const uppercaseOutput = document.getElementById('uppercaseOutput');
	const camelOutput = document.getElementById('camelOutput');
	const snakeOutput = document.getElementById('snakeOutput');
	const titleOutput = document.getElementById('titleOutput');
	const slugOutput = document.getElementById('slugOutput');

	function showMessageBox(title, content) {
		messageTitle.textContent = title;
		messageContent.textContent = content;
		messageBox.classList.remove('hidden');
		messageBox.classList.add('flex');
	}

	function closeMessageBox() {
		messageBox.classList.add('hidden');
		messageBox.classList.remove('flex');
	}

	/**
	 * Converts string to Title Case
	 */
	function toTitleCase(str) {
		return str.toLowerCase().split(' ').map(word => {
			return word.charAt(0).toUpperCase() + word.slice(1);
		}).join(' ');
	}

	function toWords(str) {
		return str.trim().match(/[\p{L}\p{N}]+/gu) || [];
	}

	function toCamelCase(str) {
		const words = toWords(str).map(word => word.toLowerCase());
		return words.map((word, index) => {
			if (index === 0) {
				return word;
			}

			return word.charAt(0).toUpperCase() + word.slice(1);
		}).join('');
	}

	function toSnakeCase(str) {
		return toWords(str).map(word => word.toLowerCase()).join('_');
	}

	/**
	 * Converts string to a Slug
	 */
	function toSlug(str) {
		return str
			.toLowerCase()
			.trim()
			.replace(/[^\w\s-]/g, '') // Remove non-word characters (except space/dash)
			.replace(/[\s_-]+/g, '-')  // Replace spaces/underscores with single dash
			.replace(/^-+|-+$/g, '');   // Trim dashes from ends
	}

	function transformText() {
		const val = textInput.value.trim();
		if (!val) {
			showMessageBox('Input Required', 'Please enter some text to transform.');
			return;
		}

		lowercaseOutput.textContent = val.toLowerCase();
		uppercaseOutput.textContent = val.toUpperCase();
		camelOutput.textContent = toCamelCase(val);
		snakeOutput.textContent = toSnakeCase(val);
		titleOutput.textContent = toTitleCase(val);
		slugOutput.textContent = toSlug(val);
	}

	async function copyToClipboard(text, button) {
		if (!text.trim() || text.toLowerCase().includes('waiting for input')) return;

		try {
			await copyTextToClipboard(text);
			flashCopyFeedback(button);
		} catch (err) {
			console.error('Copy failed.', err);
			showMessageBox('Copy Failed', 'Unable to copy text automatically.');
		}
	}

	document.querySelectorAll('.copy-btn').forEach((button) => {
		button.addEventListener('click', () => {
			const text = document.getElementById(button.dataset.copyTarget)?.textContent ?? '';
			copyToClipboard(text, button);
		});
	});

	window.copyToClipboard = copyToClipboard;

	transformBtn.addEventListener('click', transformText);

	// Auto-transform on enter (Shift+Enter for new line)
	textInput.addEventListener('keydown', (e) => {
		if (e.key === 'Enter' && !e.shiftKey) {
			e.preventDefault();
			transformText();
		}
	});
</script>

</body>
</html>
